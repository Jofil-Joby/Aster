<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Aster Chrome new-tab dashboard</title>
  <desc id="desc">A dark, minimal productivity dashboard showing the time, search bar, quick access, tasks, today and focus panels.</desc>
  <rect width="1600" height="900" rx="28" fill="#0d0f14"/>
  <rect x="42" y="42" width="1516" height="816" rx="22" fill="#10131a" stroke="#282e3a"/>
  <text x="112" y="132" fill="#f4f5f7" font-family="Arial, sans-serif" font-size="68" font-weight="700">2:28 AM</text>
  <text x="114" y="166" fill="#8290aa" font-family="Arial, sans-serif" font-size="18">Friday, August 28</text>
  <text x="520" y="190" fill="#f4f5f7" font-family="Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="2">GOOD NIGHT, JOFIL JOBY</text>
  <text x="520" y="220" fill="#8290aa" font-family="Arial, sans-serif" font-size="15">3 tasks · 6 things today</text>
  <rect x="520" y="244" width="610" height="58" rx="12" fill="#151922" stroke="#303747"/>
  <text x="550" y="280" fill="#8ca0bf" font-family="Arial, sans-serif" font-size="17">⌕  Search the web or type a command...</text>
  <text x="1044" y="280" fill="#8ca0bf" font-family="Arial, sans-serif" font-size="15">/</text>
  <text x="742" y="327" fill="#8290aa" font-family="Arial, sans-serif" font-size="13">Try <tspan fill="#e3a16c" font-weight="700">g</tspan> Google · <tspan fill="#e3a16c" font-weight="700">yt</tspan> YouTube · <tspan fill="#e3a16c" font-weight="700">gh</tspan> GitHub</text>
  <text x="112" y="366" fill="#9aabc5" font-family="Arial, sans-serif" font-size="14" font-weight="700" letter-spacing="2">QUICK ACCESS</text>
  <g font-family="Arial, sans-serif" font-size="13" text-anchor="middle">
    <rect x="116" y="394" width="58" height="58" rx="14" fill="#191e28" stroke="#303747"/><text x="145" y="428" fill="#f4f5f7" font-size="24">✦</text><text x="145" y="477" fill="#dbe0e9">ChatGPT</text>
    <rect x="214" y="394" width="58" height="58" rx="14" fill="#191e28" stroke="#303747"/><text x="243" y="428" fill="#f4f5f7" font-size="22">▶</text><text x="243" y="477" fill="#dbe0e9">YouTube</text>
    <rect x="312" y="394" width="58" height="58" rx="14" fill="#191e28" stroke="#303747"/><text x="341" y="428" fill="#f4f5f7" font-size="22">◉</text><text x="341" y="477" fill="#dbe0e9">GitHub</text>
    <rect x="410" y="394" width="58" height="58" rx="14" fill="#191e28" stroke="#303747"/><text x="439" y="428" fill="#f4f5f7" font-size="22">M</text><text x="439" y="477" fill="#dbe0e9">Gmail</text>
  </g>
  <rect x="112" y="520" width="690" height="270" rx="16" fill="#151922" stroke="#303747"/>
  <rect x="828" y="520" width="660" height="270" rx="16" fill="#151922" stroke="#303747"/>
  <text x="138" y="555" fill="#9aabc5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TASKS</text>
  <text x="750" y="555" fill="#8290aa" font-family="Arial, sans-serif" font-size="13" text-anchor="end">3 left</text>
  <line x1="138" y1="588" x2="776" y2="588" stroke="#303747"/>
  <text x="138" y="625" fill="#8290aa" font-family="Arial, sans-serif" font-size="16">Add a task...</text>
  <text x="138" y="672" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="16">◯  Eat ice cream</text>
  <text x="138" y="716" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="16">◯  Code Project xyz backend</text>
  <text x="138" y="760" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="16">◯  Study</text>
  <text x="854" y="555" fill="#9aabc5" font-family="Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="2">TODAY</text>
  <text x="1458" y="555" fill="#8290aa" font-family="Arial, sans-serif" font-size="13" text-anchor="end">6 planned</text>
  <line x1="854" y1="588" x2="1462" y2="588" stroke="#303747"/>
  <text x="854" y="632" fill="#8ca0bf" font-family="Arial, sans-serif" font-size="15">02:00</text><text x="1120" y="632" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="15">sleep</text>
  <text x="854" y="676" fill="#8ca0bf" font-family="Arial, sans-serif" font-size="15">07:00</text><text x="1120" y="676" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="15" font-weight="700">Wake up</text>
  <text x="854" y="720" fill="#8ca0bf" font-family="Arial, sans-serif" font-size="15">07:30</text><text x="1120" y="720" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="15">Breakfast</text>
  <text x="854" y="764" fill="#8ca0bf" font-family="Arial, sans-serif" font-size="15">09:00</text><text x="1120" y="764" fill="#e5e8ee" font-family="Arial, sans-serif" font-size="15">Clg</text>
  <rect x="112" y="812" width="690" height="2" fill="#e3a16c" opacity=".65"/>
  <rect x="828" y="812" width="660" height="2" fill="#e3a16c" opacity=".65"/>
</svg>
